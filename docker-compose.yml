services:
  postgres:
    image: postgres:17
    container_name: skylis-postgres
    environment:
      POSTGRES_USER: skylis
      POSTGRES_PASSWORD: skylis_dev_only
      POSTGRES_DB: skylis
    ports:
      - "5432:5432"
    volumes:
      - skylis-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skylis"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  skylis-pgdata:
