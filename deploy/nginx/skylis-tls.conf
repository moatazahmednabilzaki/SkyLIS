# Sky LIS — TLS-terminating reverse proxy (edge).
#
# Terminates HTTPS in front of the two portal containers and forwards to them over the
# loopback ports published by docker-compose.prod.yml (CLIENT_PORTAL_PORT / ADMIN_PORTAL_PORT,
# default 8080 / 8081). The portal containers already reverse-proxy /api, /health and /hubs
# to the API, so this edge only needs one location per host.
#
# Install (host nginx):
#   1. cp deploy/nginx/tls-params.conf deploy/nginx/skylis-tls.conf /etc/nginx/conf.d/
#   2. edit the two server_name lines and the ssl_certificate paths below
#   3. put certs at /etc/ssl/skylis/  (chmod 600 the private keys)
#   4. nginx -t && systemctl reload nginx
#
# Running the edge as its own container instead? Put this stack on the compose network and
# change the two proxy_pass targets to http://client-portal:80 and http://admin-portal:80.

upstream skylis_client { server 127.0.0.1:8080; keepalive 16; }
upstream skylis_admin  { server 127.0.0.1:8081; keepalive 16; }

# SignalR (live worklists) needs the WebSocket upgrade passed through.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# ---- HTTP :80 — redirect everything to HTTPS (leaving room for ACME renewals) ----
server {
    listen 80;
    listen [::]:80;
    server_name lab.example.local admin.example.local;   # <-- your hostnames

    # Let's Encrypt / certbot webroot challenge (harmless if unused).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ---- Client Portal (lab staff) ----
server {
    # `... ssl http2` works on nginx 1.18+; on 1.25.1+ prefer a separate `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name lab.example.local;                        # <-- client portal hostname

    ssl_certificate     /etc/ssl/skylis/lab.fullchain.pem;
    ssl_certificate_key /etc/ssl/skylis/lab.privkey.pem;
    include conf.d/tls-params.conf;

    client_max_body_size 25m;   # attachments (FR-SYS-007) — must match the portal vhost

    location / {
        proxy_pass http://skylis_client;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;   # long-lived SignalR sockets
    }
}

# ---- Admin Portal (platform console) ----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.example.local;                      # <-- admin portal hostname

    ssl_certificate     /etc/ssl/skylis/admin.fullchain.pem;
    ssl_certificate_key /etc/ssl/skylis/admin.privkey.pem;
    include conf.d/tls-params.conf;

    client_max_body_size 25m;

    location / {
        proxy_pass http://skylis_admin;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_read_timeout 3600s;
    }
}
