# Sky LIS — shared TLS hardening + security headers.
# Included inside each HTTPS server{} block in skylis-tls.conf. Keep operator-specific
# values (certificates, hostnames) out of here so this file can be dropped in as-is.

# Protocols & ciphers — Mozilla "intermediate" (TLS 1.2 + 1.3). Drop 1.2 for
# "modern" once every client supports 1.3.
ssl_protocols TLSv1.2 TLSv1.3;
ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
ssl_prefer_server_ciphers off;

# Session resumption
ssl_session_timeout 1d;
ssl_session_cache shared:SkyLIS_TLS:10m;
ssl_session_tickets off;

# OCSP stapling — uncomment with a chain that supports it (public CA certs do;
# a private/offline CA usually does not).
#ssl_stapling on;
#ssl_stapling_verify on;
#ssl_trusted_certificate /etc/ssl/skylis/chain.pem;
#resolver 1.1.1.1 9.9.9.9 valid=300s;
#resolver_timeout 5s;

# HSTS — force HTTPS for two years. Add `preload` only once you are certain every
# subdomain is HTTPS-only and you intend to submit to the preload list.
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

# Baseline security headers
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Frame-Options "SAMEORIGIN" always;
