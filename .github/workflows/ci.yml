name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Backend — build, unit & architecture tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore & build (warnings are errors)
        run: dotnet build SkyLIS.sln --configuration Release
      - name: Tests (domain, application, architecture gate)
        run: dotnet test SkyLIS.sln --configuration Release --no-build --logger "console;verbosity=normal"

  frontend:
    name: Portals — production builds
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Build client portal
        run: npx ng build client-portal --configuration production
      - name: Build admin portal
        run: npx ng build admin-portal --configuration production

  e2e:
    name: End-to-end — full clinical flow against PostgreSQL
    runs-on: ubuntu-latest
    needs: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_only
          POSTGRES_DB: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      ConnectionStrings__Postgres: Host=localhost;Port=5432;Database=skylis;Username=skylis;Password=skylis_dev_only
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://localhost:5178
      PGPASSWORD: postgres_dev_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Create app role & database
        run: |
          psql -h localhost -U postgres -c "CREATE ROLE skylis LOGIN PASSWORD 'skylis_dev_only' NOSUPERUSER NOCREATEROLE NOBYPASSRLS;"
          psql -h localhost -U postgres -c "CREATE DATABASE skylis OWNER skylis;"

      - name: Restore & build
        run: |
          dotnet tool restore
          dotnet build SkyLIS.sln --configuration Release

      - name: Apply migrations
        run: dotnet ef database update --project src/SkyLIS.Infrastructure --startup-project src/SkyLIS.Api --configuration Release --no-build

      - name: Apply Row-Level Security policies
        run: psql -h localhost -U postgres -d skylis -f src/SkyLIS.Infrastructure/Persistence/Scripts/enable-rls.sql

      - name: Start API
        run: |
          dotnet run --project src/SkyLIS.Api --configuration Release --no-build &
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5178/health && break || sleep 2
          done

      - name: Run the E2E suite (71 checks)
        shell: pwsh
        env:
          SKYLIS_PSQL: psql
          SKYLIS_PGPORT: '5432'
          SKYLIS_PGPASSWORD: postgres_dev_only
        run: |
          $output = & ./scripts/e2e.ps1 *>&1
          $output | Write-Host
          $failures = $output | Where-Object { $_ -match '^FAIL' }
          if ($failures) { exit 1 }
          if (-not ($output | Where-Object { $_ -match 'E2E COMPLETE' })) { exit 1 }

  onprem-stack:
    name: On-prem — production compose stack smoke test
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Create .env (CI smoke values)
        run: |
          cat > .env <<'EOF'
          SKYLIS_DB_PASSWORD=ci-smoke-db-password-123
          AUTH_SIGNING_KEY=ci-smoke-signing-key-0123456789abcdefghijklmnop
          PLATFORM_ADMIN_USERNAME=platform.admin
          PLATFORM_ADMIN_FULLNAME=CI Operator
          PLATFORM_ADMIN_PASSWORD=CiSmoke#Operator2026!
          CLIENT_PORTAL_PORT=8080
          ADMIN_PORTAL_PORT=8081
          EOF

      - name: Build & start the production stack
        run: docker compose -f docker-compose.prod.yml up -d --build

      - name: Wait for health through the nginx proxy
        run: |
          for i in $(seq 1 45); do
            curl -fsS http://localhost:8080/health && exit 0 || sleep 4
          done
          echo '--- api logs ---'; docker compose -f docker-compose.prod.yml logs api
          exit 1

      - name: 'Smoke: migrations + RLS + seeders ran; production login works'
        run: |
          # Portal serves the SPA
          curl -fsS http://localhost:8080/ | grep -qi '<app-root' || (echo 'client portal SPA missing' && exit 1)
          curl -fsS http://localhost:8081/ | grep -qi '<app-root' || (echo 'admin portal SPA missing' && exit 1)
          # Bootstrap operator can sign in through the admin portal proxy (production auth)
          TOKEN=$(curl -fsS -X POST http://localhost:8081/api/v1/auth/platform-login \
            -H 'Content-Type: application/json' \
            -d '{"userName":"platform.admin","password":"CiSmoke#Operator2026!"}' | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')
          test -n "$TOKEN"
          # Platform endpoints answer with the issued token; country packs were seeded
          curl -fsS http://localhost:8081/api/v1/platform/country-packs -H "Authorization: Bearer $TOKEN" | grep -q '"EG"'
          # The dev token endpoint must NOT exist in Production
          CODE=$(curl -s -o /dev/null -w '%{http_code}' -X POST http://localhost:8081/api/v1/dev/token -H 'Content-Type: application/json' -d '{"scope":"platform"}')
          test "$CODE" = "404" || (echo "dev endpoint reachable in Production ($CODE)!" && exit 1)

      - name: Stack logs on failure
        if: failure()
        run: docker compose -f docker-compose.prod.yml logs

      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.prod.yml down -v
